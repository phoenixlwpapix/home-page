<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="嗨，我是以恒！这里有我的小作品、运动日常和旅行照片。"
    />
    <meta name="theme-color" content="#f6f7f2" />
    <title>STUDIO YYH — 以恒的小天地</title>
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        var root = document.documentElement;
        var dark = false;
        var lang = "zh";
        try {
          var savedTheme = localStorage.getItem("theme");
          if (savedTheme === "dark") dark = true;
          else if (savedTheme === "light") dark = false;
          else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            dark = true;
          }
          var savedLang = localStorage.getItem("language");
          if (savedLang === "en" || savedLang === "zh") lang = savedLang;
        } catch (_) {}
        if (dark) {
          root.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#101b25");
        }
        root.lang = lang === "en" ? "en" : "zh-CN";
        if (lang === "en") {
          document.title = "STUDIO YYH — Aaron's little corner";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
